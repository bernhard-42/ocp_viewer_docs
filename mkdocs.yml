site_name: OCP CAD Viewer
site_description: One documentation for the OCP CAD viewer family — ocp_vscode, ocp_viewer, Jupyter CadQuery and build123d Studio
site_url: https://bernhard-42.github.io/ocp_viewer_docs/
repo_url: https://github.com/bernhard-42/ocp_viewer_docs
repo_name: ocp_viewer_docs

theme:
  name: material
  palette:
    # follow the system by default, with a manual toggle both ways
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.footnote.tooltips

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.caption

nav:
  - Home: index.md
  - The viewer:
      - Overview: viewer.md
      - Analysis tools:
          - Measure mode: measure.md
          - Object selection: selector.md
  - The Python API:
      - Showing objects:
          - show: show.md
          - show_object: show_object.md
          - push_object / show_objects: push_object.md
          - show_all: show_all.md
          - Additional functions: api.md
      - Configuring:
          - The config system: config.md
          - set_viewer_config: set_viewer_config.md
          - Enums: enums.md
      - Appearance and scene:
          - Color maps: colormaps.md
          - Materials and Studio: pbr_studio.md
          - ImageFace: image_face.md
          - Animation: animation.md
  - Hosts:
      - VS Code CAD Viewer:
          - Installation: hosts/ocp_vscode/installation.md
          - Workspace Config: hosts/ocp_vscode/workspace_config.md
          - Addressing a viewer: hosts/ocp_vscode/addressing.md
      - OCP Viewer:
          - Installation: hosts/ocp_viewer/installation.md
          - Workspace Config: hosts/ocp_viewer/workspace_config.md
          - Addressing a viewer: hosts/ocp_viewer/addressing.md
      - Jupyter CadQuery:
          - Installation: hosts/jupyter_cadquery/installation.md
          - Workspace Config: hosts/jupyter_cadquery/workspace_config.md
          - Addressing a viewer: hosts/jupyter_cadquery/addressing.md
      - build123d Studio:
          - Installation: hosts/build123d_studio/installation.md
          - Workspace Config: hosts/build123d_studio/workspace_config.md
          - First Run: hosts/build123d_studio/first_run.md
