          - Viewer and Library Manager: viewers/ocp_vscode/managers.md
          - Workspace Config: viewers/ocp_vscode/workspace_config.md
          - Addressing a viewer: viewers/ocp_vscode/addressing.md
          - Visual debugging: viewers/ocp_vscode/visual_debugging.md
          - Jupyter Console: viewers/ocp_vscode/jupyter_console.md
          - Commands and snippets: viewers/ocp_vscode/commands.md
