site_name: OCP CAD Viewer
site_description: One documentation for the OCP CAD viewer family — ocp_vscode, ocp_viewer, Jupyter CadQuery and build123d Studio
site_url: https://bernhard-42.github.io/ocp_viewer_docs/
repo_url: https://github.com/bernhard-42/ocp_viewer_docs
repo_name: ocp_viewer_docs

theme:
  name: material
  palette:
    # three-way toggle: follow the system (auto) -> light -> dark -> auto
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.footnote.tooltips

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox

markdown_extensions:
  - abbr
  - admonition
  - footnotes
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.caption
  - pymdownx.details
  # the glossary: appended to every page, so each term carries its tooltip
  - pymdownx.snippets:
      auto_append:
        - includes/glossary.md

nav:
