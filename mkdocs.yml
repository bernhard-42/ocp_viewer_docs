      - Dynamic features: dynamic_features.md
  - The Python API:
      - Showing objects:
          - show: show.md
          - show_object: show_object.md
          - push_object / show_objects: push_object.md
          - show_all: show_all.md
          - Keeping the camera orientation: reset_camera.md
          - Additional functions: api.md
      - Configuring:
          - The config system: config.md
          - set_viewer_config: set_viewer_config.md
          - Enums: enums.md
      - Appearance:
          - Color maps: colormaps.md
          - Materials and Studio: pbr_studio.md
